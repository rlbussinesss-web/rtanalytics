name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-checks every package and enforces the tracker's gzip budget,
      # which is the one regression a visitor would actually feel.
      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm vitest run
